<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻宝大冒险 - 全景地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 全景地图容器 */
        .panorama-container {
            width: 100%;
            height: 100vh;
            position: relative;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:%23a8d8ff"/><stop offset="100%" style="stop-color:%23f0f8ff"/></linearGradient></defs><rect width="1200" height="800" fill="url(%23sky)"/><circle cx="1000" cy="150" r="80" fill="%23FFD700" opacity="0.8"/><path d="M0 600 Q300 500 600 550 T1200 600 L1200 800 L0 800 Z" fill="%2332CD32"/><path d="M100 650 Q150 600 200 650 T300 650 L300 800 L100 800 Z" fill="%23228B22"/><path d="M800 620 Q850 570 900 620 T1000 620 L1000 800 L800 800 Z" fill="%23228B22"/></svg>') no-repeat center/cover;
        }

        /* 地点标记 */
        .location {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .location:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .location.completed {
            background: #4CAF50 !important;
            animation: none;
        }

        .location.current {
            background: #FF9800 !important;
            animation: pulse 1s infinite;
        }

        /* 具体地点位置 */
        #library {
            background: #8B4513;
            top: 30%;
            left: 15%;
        }

        #jungle {
            background: #228B22;
            top: 40%;
            left: 25%;
        }

        #temple {
            background: #D2691E;
            top: 40%;
            left: 50%;
        }

        #chamber {
            background: #696969;
            top: 60%;
            left: 70%;
        }

        #treasury {
            background: #FFD700;
            top: 25%;
            left: 85%;
        }

        /* 地点标签 */
        .location-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
        }

        /* 标题 */
        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        .title h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* 音乐控制 */
        .music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .music-control:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        /* 进度条 */
        .progress-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
        }

        .progress-bar {
            background: rgba(255,255,255,0.3);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            background: #4CAF50;
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .progress-text {
            color: white;
            text-align: center;
            margin-top: 5px;
            font-size: 14px;
        }

        /* 地点页面的返回按钮 */
        .location-back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .location-back-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        /* 音乐提示 */
        .music-prompt {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="panorama-container" id="panorama">
        <div class="title">
            <h1>寻宝大冒险</h1>
            <p>点击地点开始探索</p>
        </div>

        <!-- 地点标记 -->
        <div class="location" id="library" data-location="library" data-name="图书馆">
            📚
            <div class="location-label">图书馆</div>
        </div>

        <div class="location" id="jungle" data-location="jungle" data-name="丛林">
            🌴
            <div class="location-label">丛林</div>
        </div>

        <div class="location" id="temple" data-location="temple" data-name="神庙">
            🏛️
            <div class="location-label">神庙</div>
        </div>

        <div class="location" id="chamber" data-location="chamber" data-name="验证室">
            🔍
            <div class="location-label">验证室</div>
        </div>

        <div class="location" id="treasury" data-location="treasury" data-name="宝箱室">
            💎
            <div class="location-label">宝箱室</div>
        </div>

        <!-- 音乐控制 -->
        <button class="music-control" id="musicToggle">🎵</button>
        <div class="music-prompt" id="musicPrompt">点击音乐图标开启背景音乐</div>

        <!-- 进度条 -->
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">探索进度: 0/5</div>
        </div>

        <!-- 背景音乐 -->
        <audio id="bgMusic" loop>
            <source src="audio/panorama.mp3" type="audio/mpeg">
            您的浏览器不支持音频元素。
        </audio>
    </div>

    <!-- 地点页面容器 -->
    <div id="locationContainer" style="display: none; width: 100%; height: 100vh;"></div>

    <script>
        class TreasureGame {
            constructor() {
                // 初始化游戏状态，确保从空数组开始
                this.gameState = this.loadGameState();
                this.currentLocation = null;
                this.bgMusic = document.getElementById('bgMusic');
                this.musicToggle = document.getElementById('musicToggle');
                this.musicPrompt = document.getElementById('musicPrompt');
                this.progressFill = document.getElementById('progressFill');
                this.progressText = document.getElementById('progressText');
                this.locationMusic = null; // 当前地点的音乐元素
                
                this.initEventListeners();
                this.updateUI();
                
                // 尝试播放背景音乐，但由于浏览器限制可能需要用户交互
                this.tryPlayBackgroundMusic();
            }

            initEventListeners() {
                // 地点点击事件
                document.querySelectorAll('.location').forEach(location => {
                    location.addEventListener('click', (e) => {
                        const locationType = e.currentTarget.dataset.location;
                        this.enterLocation(locationType);
                    });
                });

                // 音乐控制
                this.musicToggle.addEventListener('click', () => {
                    this.toggleMusic();
                    this.musicPrompt.style.display = 'none';
                });

                // 页面任意位置点击时尝试播放音乐（解决自动播放限制）
                document.addEventListener('click', () => {
                    if (this.gameState.musicEnabled && this.bgMusic.paused) {
                        this.playBackgroundMusic();
                        this.musicPrompt.style.display = 'none';
                    }
                }, { once: true });

                // 页面卸载时保存状态
                window.addEventListener('beforeunload', () => {
                    this.saveGameState();
                });
            }

            enterLocation(locationType) {
                this.currentLocation = locationType;
                const locationNames = {
                    library: '图书馆',
                    jungle: '丛林',
                    temple: '神庙',
                    chamber: '验证室',
                    treasury: '宝箱室'
                };

                // 隐藏全景图，显示地点页面
                document.getElementById('panorama').style.display = 'none';
                document.getElementById('locationContainer').style.display = 'block';

                // 加载地点页面
                this.loadLocationPage(locationType, locationNames[locationType]);
                
                // 更新游戏状态 - 只有当挑战未完成时才计入进度
                if (!this.gameState.completedChallenges.includes(locationType)) {
                    // 记录已访问的地点，但不直接计入完成进度
                    if (!this.gameState.visitedLocations.includes(locationType)) {
                        this.gameState.visitedLocations.push(locationType);
                        this.saveGameState();
                    }
                    this.updateUI();
                }
            }

            exitLocation() {
                // 停止当前地点音乐
                if (this.locationMusic) {
                    this.locationMusic.pause();
                    this.locationMusic = null;
                }
                
                this.currentLocation = null;
                document.getElementById('panorama').style.display = 'block';
                document.getElementById('locationContainer').style.display = 'none';
                
                // 播放背景音乐
                this.playBackgroundMusic();
            }

            // 获取地点对应的背景音乐URL
            getLocationMusicUrl(locationType) {
                const musicMap = {
                    library: 'audio/library.mp3',
                    jungle: 'audio/jungle.mp3',
                    temple: 'audio/temple.mp3',
                    chamber: 'audio/chamber.mp3',
                    treasury: 'audio/treasury.mp3'
                };
                return musicMap[locationType];
            }

            loadLocationPage(locationType, locationName) {
                const container = document.getElementById('locationContainer');
                const musicUrl = this.getLocationMusicUrl(locationType);
                
                // 加载地点页面内容，包含专门的返回按钮
                container.innerHTML = `
                    <div style="width: 100%; height: 100vh; background: linear-gradient(135deg, #1e3c72, #2a5298); 
                                display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; position: relative;">
                        <!-- 地点页面的返回按钮 -->
                        <button class="location-back-btn" id="locationBackBtn">返回全景地图</button>
                        
                        <h1>${locationName}</h1>
                        <p>欢迎来到${locationName}！这里隐藏着重要的线索...</p>
                        
                        <!-- 地点背景音乐 -->
                        <audio id="locationMusic" loop>
                            <source src="${musicUrl}" type="audio/mpeg">
                            您的浏览器不支持音频元素。
                        </audio>
                         
                        <!-- 地点音乐控制 -->
                        <button class="music-control" id="locationMusicToggle" style="top: 20px; right: 20px;">
                            ${this.gameState.musicEnabled ? '🎵' : '🔇'}
                        </button>
                        
                        <!-- 地点内容区域 -->
                        <div id="locationContent" style="margin-top: 20px; padding: 20px; 
                             background: rgba(255,255,255,0.1); border-radius: 10px; max-width: 600px;">
                            <p>地点内容加载中...</p>
                        </div>
                    </div>
                `;

                // 获取地点音乐元素并设置事件监听
                this.locationMusic = document.getElementById('locationMusic');
                document.getElementById('locationMusicToggle').addEventListener('click', () => {
                    this.toggleMusic();
                });

                // 为地点页面的返回按钮添加事件监听
                document.getElementById('locationBackBtn').addEventListener('click', () => {
                    this.exitLocation();
                });

                // 根据地点类型加载具体内容
                this.loadLocationContent(locationType);
                
                // 播放地点音乐（如果音乐是开启状态）
                if (this.gameState.musicEnabled) {
                    this.locationMusic.play().catch(e => {
                        console.log('地点音乐播放失败:', e);
                    });
                }
                
                // 暂停背景音乐
                this.bgMusic.pause();
            }

            loadLocationContent(locationType) {
                const contentMap = {
                    library: {
                        title: '📚 古老图书馆',
                        description: '尘封的古籍中藏着第一个线索...',
                        challenge: '解开古老的谜题，找到隐藏的符号组合。',
                        icon: '📜'
                    },
                    jungle: {
                        title: '🌴 神秘丛林',
                        description: '茂密的丛林中隐藏着通往神庙的道路...',
                        challenge: '穿越危险的丛林，避开各种陷阱。',
                        icon: '🗺️'
                    },
                    temple: {
                        title: '🏛️ 古代神庙',
                        description: '庄严的神庙中藏着守护者的秘密...',
                        challenge: '与神庙守护者对话，获得神秘钥匙。',
                        icon: '🔑'
                    },
                    chamber: {
                        title: '🔍 验证室',
                        description: '这里可以验证你找到的钥匙是否正确...',
                        challenge: '选择正确的钥匙组合，解开最终谜题。',
                        icon: '🔐'
                    },
                    treasury: {
                        title: '💎 宝箱室',
                        description: '传说中的宝藏就在这里...',
                        challenge: '打开宝箱，获得传说中的宝藏！',
                        icon: '💰'
                    }
                };

                const content = contentMap[locationType];
                const container = document.getElementById('locationContent');
                
                // 检查挑战是否已完成
                const isCompleted = this.gameState.completedChallenges.includes(locationType);
                
                container.innerHTML = `
                    <div style="text-align: center;">
                        <div style="font-size: 4rem; margin-bottom: 20px;">${content.icon}</div>
                        <h2>${content.title}</h2>
                        <p style="margin: 15px 0; font-size: 1.1rem;">${content.description}</p>
                        <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin: 20px 0;">
                            <strong>挑战:</strong> ${content.challenge}
                        </div>
                        ${isCompleted ? 
                            '<div style="color: #4CAF50; margin-top: 15px; font-size: 1.2rem;">✓ 挑战已完成</div>' : 
                            '<button onclick="game.startLocationChallenge(\''+locationType+'\')" \
                                    style="background: #4CAF50; color: white; border: none; padding: 12px 24px; \
                                           border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px;">\
                                开始挑战\
                            </button>'
                        }
                    </div>
                `;
            }

            startLocationChallenge(locationType) {
                // 标记该地点挑战已完成
                if (!this.gameState.completedChallenges.includes(locationType)) {
                    this.gameState.completedChallenges.push(locationType);
                    this.saveGameState();
                    this.loadLocationContent(locationType); // 刷新内容显示已完成
                    this.updateUI(); // 更新进度显示
                    
                    // 显示完成提示
                    setTimeout(() => {
                        alert(`恭喜！你完成了${this.getLocationName(locationType)}的挑战！`);
                    }, 500);
                }
            }

            getLocationName(locationType) {
                const locationNames = {
                    library: '图书馆',
                    jungle: '丛林',
                    temple: '神庙',
                    chamber: '验证室',
                    treasury: '宝箱室'
                };
                return locationNames[locationType] || locationType;
            }

            getLocationStep(locationType) {
                const stepMap = {
                    library: 1,
                    jungle: 2,
                    temple: 3,
                    chamber: 4,
                    treasury: 5
                };
                return stepMap[locationType] || 0;
            }

            updateUI() {
                // 更新地点状态
                document.querySelectorAll('.location').forEach(location => {
                    const locationType = location.dataset.location;
                    location.classList.remove('completed', 'current');
                    
                    // 只有完成挑战的地点才标记为已完成
                    if (this.gameState.completedChallenges.includes(locationType)) {
                        location.classList.add('completed');
                    }
                    
                    if (this.currentLocation === locationType) {
                        location.classList.add('current');
                    }
                });

                // 更新进度条 - 基于已完成的挑战数量
                const totalLocations = 5;
                const completedCount = this.gameState.completedChallenges.length;
                const progress = (completedCount / totalLocations) * 100;
                this.progressFill.style.width = `${progress}%`;
                this.progressText.textContent = `探索进度: ${completedCount}/${totalLocations}`;

                // 更新所有音乐控制按钮的图标
                const musicIcon = this.gameState.musicEnabled ? '🎵' : '🔇';
                this.musicToggle.textContent = musicIcon;
                
                const locationMusicToggle = document.getElementById('locationMusicToggle');
                if (locationMusicToggle) {
                    locationMusicToggle.textContent = musicIcon;
                }
            }

            // 尝试播放背景音乐，处理浏览器自动播放限制
            tryPlayBackgroundMusic() {
                if (this.gameState.musicEnabled) {
                    this.bgMusic.play().catch(e => {
                        console.log('自动播放失败，需要用户交互:', e);
                        // 显示提示，告诉用户需要点击才能播放音乐
                        this.musicPrompt.style.display = 'block';
                        
                        // 3秒后自动隐藏提示
                        setTimeout(() => {
                            this.musicPrompt.style.display = 'none';
                        }, 3000);
                    });
                }
            }

            playBackgroundMusic() {
                if (this.gameState.musicEnabled) {
                    this.bgMusic.play().catch(e => {
                        console.log('背景音乐播放失败:', e);
                    });
                }
            }

            toggleMusic() {
                this.gameState.musicEnabled = !this.gameState.musicEnabled;
                
                // 更新背景音乐状态
                if (this.gameState.musicEnabled) {
                    this.bgMusic.play().catch(e => {
                        console.log('音乐播放失败:', e);
                    });
                } else {
                    this.bgMusic.pause();
                }
                
                // 更新地点音乐状态
                if (this.locationMusic) {
                    if (this.gameState.musicEnabled) {
                        this.locationMusic.play().catch(e => {
                            console.log('地点音乐播放失败:', e);
                        });
                    } else {
                        this.locationMusic.pause();
                    }
                }
                
                // 更新UI和保存状态
                this.updateUI();
                this.saveGameState();
            }

            loadGameState() {
                const defaultState = {
                    visitedLocations: [],     // 已访问的地点
                    completedChallenges: [],  // 已完成的挑战（决定进度）
                    currentStep: 0,           // 当前进度
                    musicEnabled: true,       // 音乐是否开启
                    treasuresFound: 0,        // 找到的宝藏数量
                    lastPlayed: Date.now()    // 最后游戏时间
                };

                try {
                    const saved = localStorage.getItem('treasureGameState');
                    // 如果有保存的状态，返回它，否则返回默认状态
                    return saved ? JSON.parse(saved) : defaultState;
                } catch (e) {
                    console.log('加载游戏状态失败:', e);
                    // 清除可能损坏的存储数据
                    localStorage.removeItem('treasureGameState');
                    return defaultState;
                }
            }

            saveGameState() {
                try {
                    this.gameState.lastPlayed = Date.now();
                    localStorage.setItem('treasureGameState', JSON.stringify(this.gameState));
                } catch (e) {
                    console.log('保存游戏状态失败:', e);
                }
            }
        }

        // 启动游戏
        const game = new TreasureGame();
    </script>
</body>
</html>
